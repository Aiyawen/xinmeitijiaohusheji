<style>

  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }

  #stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }

  /* 幻灯片：叠放，仅 active 可见 */
  .slide {
    position:absolute; width:min(94vw, calc(88vh * 16 / 9)); aspect-ratio:16/9;
    opacity:0; visibility:hidden; transform:scale(.965) translateY(10px);
    transition: opacity .55s cubic-bezier(.4,0,.2,1),
                transform .8s cubic-bezier(.22,1,.36,1),
                filter .55s ease;
    filter:blur(6px);
    background:var(--ink);
    box-shadow:0 30px 90px rgba(0,0,0,.7);
  }
  .slide.active { opacity:1; visibility:visible; transform:scale(1) translateY(0); filter:blur(0); z-index:2; }
  .slide.out { opacity:0; transform:scale(1.035) translateY(-8px); filter:blur(8px); z-index:1; }
  .slide-inner { width:100%; height:100%; }
  .slide-inner svg { width:100%; height:100%; display:block; }

  /* 血红掠过转场 */
  #wipe {
    position:fixed; top:0; left:0; width:100%; height:100%;
    background:linear-gradient(90deg, transparent, var(--blood) 45%, var(--blood-dark) 55%, transparent);
    transform:translateX(-120%); opacity:0; pointer-events:none; z-index:40;
  }
  #wipe.sweep { animation:sweep .85s cubic-bezier(.7,0,.3,1); }
  @keyframes sweep {
    0% { transform:translateX(-120%); opacity:.9; }
    50% { opacity:.95; }
    100% { transform:translateX(120%); opacity:0; }
  }

  /* 顶部信息条 */
  #topbar {
    position:fixed; top:0; left:0; right:0; height:52px;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 26px; z-index:30; pointer-events:none;
    background:linear-gradient(180deg, rgba(18,18,18,.85), transparent);
  }
  #brand { font-size:13px; letter-spacing:3px; color:var(--blood); font-weight:bold; }
  #brand small { color:var(--muted); font-weight:normal; letter-spacing:1px; }
  #chapter { font-size:13px; color:var(--muted); letter-spacing:2px; }

  /* 底部控制 */
  #bottom {
    position:fixed; bottom:0; left:0; right:0; z-index:30;
    display:flex; align-items:center; gap:18px;
    padding:16px 26px 20px;
    background:linear-gradient(0deg, rgba(18,18,18,.92), transparent);
  }
  .nav-btn {
    flex:none; width:44px; height:44px; border-radius:50%;
    border:1px solid var(--line); background:var(--panel); color:var(--paper);
    font-size:20px; cursor:pointer; display:grid; place-items:center;
    transition:all .2s ease;
  }
  .nav-btn:hover { border-color:var(--blood); color:var(--blood); transform:scale(1.08); }
  .nav-btn:disabled { opacity:.3; cursor:default; transform:none; border-color:var(--line); color:var(--muted); }
  #dots { flex:1; display:flex; align-items:center; justify-content:center; gap:10px; }
  .dot {
    width:26px; height:5px; border:none; border-radius:2px; cursor:pointer;
    background:var(--line); transition:all .35s ease; padding:0;
  }
  .dot:hover { background:var(--blood-dark); }
  .dot.active { background:var(--blood); width:40px; }
  #counter { flex:none; font-size:14px; color:var(--muted); letter-spacing:1px; min-width:64px; text-align:right; }
  #counter b { color:var(--paper); font-size:20px; }
  .tool-btn {
    flex:none; width:38px; height:38px; border-radius:8px;
    border:1px solid var(--line); background:transparent; color:var(--muted);
    font-size:16px; cursor:pointer; display:grid; place-items:center; transition:all .2s;
  }
  .tool-btn:hover { border-color:var(--blood); color:var(--paper); }

  /* 帮助浮层 */
  #help {
    position:fixed; inset:0; z-index:60; display:none;
    align-items:center; justify-content:center; background:rgba(0,0,0,.82);
  }
  #help.show { display:flex; }
  #help .box {
    border:1px solid var(--blood); background:var(--ink);
    padding:36px 44px; max-width:520px;
  }
  #help h2 { color:var(--blood); letter-spacing:4px; margin-bottom:20px; font-size:22px; }
  #help p { color:var(--paper); line-height:2; font-size:15px; }
  #help kbd { display:inline-block; min-width:26px; text-align:center; padding:2px 8px; margin:0 3px;
    border:1px solid var(--line); border-radius:4px; background:var(--panel); color:var(--paper); font-family:monospace; }

  /* 点击翻页热区 */
  #clickzone { position:fixed; inset:52px 0 80px; display:flex; z-index:10; pointer-events:none; }
  #clickzone .half { flex:1; pointer-events:auto; cursor:pointer; }

  @media (max-width:640px) {
    #brand small, #chapter { display:none; }
    #bottom { gap:10px; padding:12px 14px 16px; }
    .dot { width:16px; } .dot.active { width:26px; }
    #counter { min-width:52px; font-size:12px; } #counter b { font-size:16px; }
  }
</style>

<script>
(function(){
  const slides = Array.from(document.querySelectorAll('.slide'));
  const dots = Array.from(document.querySelectorAll('.dot'));
  const chapNames = slides.map(s=>s.dataset.chap);
  let cur = 0, busy = false;
  const wipe = document.getElementById('wipe');
  const chapterEl = document.getElementById('chapter');
  const curEl = document.getElementById('cur');
  const prevBtn = document.getElementById('prev');
  const nextBtn = document.getElementById('next');

  function render(idx, animate=true){
    if(idx<0 || idx>=slides.length || idx===cur) return;
    if(animate){
      busy = true;
      wipe.classList.remove('sweep'); void wipe.offsetWidth; wipe.classList.add('sweep');
    }
    const old = slides[cur];
    const now = slides[idx];
    old.classList.remove('active');
    old.classList.add('out');
    setTimeout(()=>old.classList.remove('out'), 850);
    now.classList.remove('out');
    now.classList.add('active');
    cur = idx;
    dots.forEach((d,i)=>d.classList.toggle('active', i===cur));
    chapterEl.textContent = chapNames[cur];
    curEl.textContent = (cur+1);
    prevBtn.disabled = (cur===0);
    nextBtn.disabled = (cur===slides.length-1);
    if(animate) setTimeout(()=>{ busy=false; }, 700);
  }
  function go(step){ render(cur+step); }

  document.getElementById('prev').addEventListener('click', ()=>go(-1));
  document.getElementById('next').addEventListener('click', ()=>go(1));
  document.getElementById('prev-zone').addEventListener('click', ()=>go(-1));
  document.getElementById('next-zone').addEventListener('click', ()=>go(1));
  dots.forEach((d,i)=>d.addEventListener('click', ()=>render(i, i!==cur)));

  document.addEventListener('keydown', e=>{
    if(document.getElementById('help').classList.contains('show') && e.key!=='?' && e.key!=='Escape'){
      document.getElementById('help').classList.remove('show'); return;
    }
    switch(e.key){
      case 'ArrowRight': case 'PageDown': case ' ': e.preventDefault(); go(1); break;
      case 'ArrowLeft': case 'PageUp': e.preventDefault(); go(-1); break;
      case 'Home': render(0); break;
      case 'End': render(slides.length-1); break;
      case 'f': case 'F': toggleFull(); break;
      case '?': document.getElementById('help').classList.toggle('show'); break;
      case 'Escape': document.getElementById('help').classList.remove('show'); break;
    }
  });

  function toggleFull(){
    if(!document.fullscreenElement){ document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); }
    else { document.exitFullscreen&&document.exitFullscreen(); }
  }
  document.getElementById('fullscreen').addEventListener('click', toggleFull);
  document.getElementById('helpbtn').addEventListener('click', ()=>document.getElementById('help').classList.toggle('show'));
  document.getElementById('help').addEventListener('click', ()=>document.getElementById('help').classList.remove('show'));

  // 触摸滑动
  let tx=0;
  document.getElementById('stage').addEventListener('touchstart', e=>{ tx=e.changedTouches[0].clientX; }, {passive:true});
  document.getElementById('stage').addEventListener('touchend', e=>{
    const dx=e.changedTouches[0].clientX - tx;
    if(Math.abs(dx)>60) go(dx<0?1:-1);
  }, {passive:true});

  prevBtn.disabled = true;
  chapterEl.textContent = chapNames[0];
})();
</script>
